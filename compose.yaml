
services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bitsec-network
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: bitsec-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bitsec-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bitsec-network:
    driver: bridge
